name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          API_URL: https://bloodbridge-rove.onrender.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
      # After build, so next-env.d.ts and route types exist
      - run: npm run typecheck
